name: 개강 과정 자동 갱신

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 한국시간 오전 6시
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HRD-Net에서 과정 받아 courses.json 갱신
        env:
          HRD_KEY: ${{ secrets.HRD_KEY }}
        run: python3 update_courses.py
      - name: 바뀐 내용이 있으면 저장
        run: |
          if git diff --quiet courses.json; then
            echo "변경 없음"
          else
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add courses.json
            git commit -m "개강 과정 자동 갱신 $(TZ=Asia/Seoul date +%F)"
            git push
          fi
