name: 개강 과정 갱신

# 고용24가 GitHub 서버(해외) 접속을 막아서 자동 예약은 껐습니다.
# 한국 IP의 컴퓨터(self-hosted runner)를 연결하면 schedule을 다시 켤 수 있습니다.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 고용24에서 과정 읽기
        env:
          TZ: Asia/Seoul
        run: python tools/update_courses.py courses.json
      - name: 바뀌었으면 커밋
        run: |
          if git diff --quiet courses.json; then
            echo "변경 없음"
          else
            git config user.name "course-bot"
            git config user.email "course-bot@users.noreply.github.com"
            git add courses.json
            git commit -m "개강 과정 자동 갱신 $(TZ=Asia/Seoul date +%F)"
            git push
          fi
