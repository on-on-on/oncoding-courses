name: 개강 과정 갱신

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 오전 6:17 (한국시간)
  workflow_dispatch:         # Actions 탭에서 'Run workflow'로 바로 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 고용24에서 과정 읽기
        env:
          TZ: Asia/Seoul
        run: python tools/update_courses.py courses.json
      - name: 바뀌었으면 커밋
        run: |
          if git diff --quiet courses.json; then
            echo "변경 없음"
          else
            git config user.name "course-bot"
            git config user.email "course-bot@users.noreply.github.com"
            git add courses.json
            git commit -m "개강 과정 자동 갱신 $(TZ=Asia/Seoul date +%F)"
            git push
          fi
